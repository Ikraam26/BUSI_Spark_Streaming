# Configuration du projet, lue par le producer et le consumer avec la librairie Typesafe Config.
# Les chemins sont relatifs a la racine du projet (dossier depuis lequel on lance les programmes).

# ---------- Producer : simule l'arrivee des images ----------
producer {
  # base BUSI complete (780 images + masques, ignores par le producer), sur le Bureau
  # ancienne petite base : "data/Source"
  source-dir      = "../Dataset_BUSI_with_GT"
  destination-dir = "data/destination"
  staging-dir     = "data/staging"   // ecriture temporaire avant le rename atomique
  batch-size      = 10               // nombre d'images envoyees a chaque lot
  interval        = 1 second         // pause entre deux lots
  mode            = "copy"           // "copy" garde la source, "move" la supprime
  shuffle         = true             // ordre aleatoire des images (sinon triees par classe)

}

# ---------- Consumer : traite le flux d'images avec Spark Structured Streaming ----------
consumer {
  input-dir             = "data/destination"  // dossier surveille (ou le producer depose les images)
  output-dir            = "data/output"      // CSV lus par le dashboard Streamlit
  checkpoint-dir        = "data/checkpoint"  // memoire de Spark : fichiers deja traites, etat des agregations
  model-dir             = "model"            // modele exporte par le service ML (Python)
  trigger-interval      = 5 seconds          // un micro-batch toutes les 5 secondes
  max-files-per-trigger = 20                 // au plus 20 nouvelles images par micro-batch
  window-duration       = 10 seconds         // taille des fenetres de temps (window_counts.csv)
  watermark             = 30 seconds         // retard maximum accepte pour une image
}
